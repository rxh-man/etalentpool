<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>e& Governance — Talent Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --maroon:#800000;
  --maroon-2:#A0182B;
  --maroon-deep:#4D0010;
  --gold:#C9A84C;
  --gold-2:#E6C66A;
  --ink:#140A0C;
  --ink-2:#22141A;
  --line:#ECE2E4;
  --line-strong:#D4BFC4;
  --bg:#F8F4F4;
  --surface:#FFFFFF;
  --muted:#776068;
  --green:#16794C;
  --green-bg:#E3F3EC;
  --red:#B42318;
  --red-bg:#FBE7E4;
  --amber:#8A5A00;
  --amber-bg:#FBEFD0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,.font-display{font-family:'Sora',sans-serif;letter-spacing:-0.01em;font-weight:700;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit;text-decoration:none}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--maroon-deep);color:#fff;display:flex;flex-direction:column;border-right:1px solid #000}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:38px;height:38px;background:var(--gold);color:var(--maroon-deep);display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:20px}
.brand-text{font-family:'Sora';font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#fff;line-height:1.2}
.brand-text small{display:block;color:var(--gold-2);font-size:10px;letter-spacing:.18em;font-weight:500;margin-top:3px}
.nav{padding:14px 10px;flex:1;overflow:auto}
.nav-section{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.45);padding:14px 12px 6px;text-transform:uppercase;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;color:rgba(255,255,255,.78);font-size:13.5px;font-weight:500;border-left:2px solid transparent;transition:all .15s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(201,168,76,.18),transparent);border-left-color:var(--gold)}
.nav svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.8}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.05em}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:24px;position:sticky;top:0;z-index:20}
.topbar .page-title{font-family:'Sora';font-weight:600;font-size:15px}
.topbar .crumb{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
.topbar .spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:#fff}
.user-avatar{width:30px;height:30px;background:var(--maroon);color:#fff;display:grid;place-items:center;font-weight:700;font-family:'Sora';font-size:12px}
.user-meta{line-height:1.15}
.user-meta .nm{font-weight:600;font-size:13px}
.user-meta .rl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.role-badge{font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 7px;background:var(--gold);color:var(--maroon-deep);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;font-weight:600;font-size:13px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);transition:all .15s}
.btn:hover{border-color:var(--maroon);color:var(--maroon)}
.btn-primary{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn-primary:hover{background:var(--maroon-2);border-color:var(--maroon-2);color:#fff}
.btn-gold{background:var(--gold);color:var(--maroon-deep);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold-2);border-color:var(--gold-2);color:var(--maroon-deep)}
.btn-danger{color:var(--red);border-color:#E8C0BB}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn svg{width:15px;height:15px;stroke-width:2}

.content{padding:24px 28px 60px;max-width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:18px;flex-wrap:wrap}
.page-head h1{font-size:24px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);padding:18px 18px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--maroon)}
.kpi.gold::before{background:var(--gold)}
.kpi.green::before{background:var(--green)}
.kpi.ink::before{background:var(--ink)}
.kpi .label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .value{font-family:'Sora';font-weight:700;font-size:30px;margin-top:8px;letter-spacing:-.02em}
.kpi .meta{font-size:12px;color:var(--muted);margin-top:4px}

.grid-charts{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);padding:18px}
.card h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h3 .hint{font-size:10.5px;color:var(--muted);letter-spacing:.1em;font-weight:500}
.col-4{grid-column:span 4}
.col-6{grid-column:span 6}
.col-8{grid-column:span 8}
.col-12{grid-column:span 12}
.chart-wrap{position:relative;height:260px}
.chart-wrap.tall{height:300px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-bottom:0}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);background:#fff;outline:none}
.search input:focus{border-color:var(--maroon)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.select{padding:9px 10px;border:1px solid var(--line-strong);background:#fff;font-size:13px;min-width:140px}
.select:focus{outline:none;border-color:var(--maroon)}

.table-wrap{background:#fff;border:1px solid var(--line);overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
table.data thead th{background:#FAF4F5;color:var(--ink-2);text-align:left;padding:11px 12px;font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
table.data tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tbody tr{cursor:pointer;transition:background .12s}
table.data tbody tr:hover{background:#FBF7F8}
table.data .num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:3px 8px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.badge.pass{background:var(--green-bg);color:var(--green)}
.badge.fail{background:var(--red-bg);color:var(--red)}
.badge.hold{background:var(--amber-bg);color:var(--amber)}
.badge.neutral{background:#EDE4E6;color:var(--ink-2)}
.tag{display:inline-block;padding:2px 7px;font-size:11px;background:#F1E7EA;color:var(--maroon-deep);border:1px solid var(--line)}

.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border:1px solid var(--line);border-top:0;font-size:13px;color:var(--muted)}
.pages{display:flex;gap:4px}
.pages button{padding:5px 10px;border:1px solid var(--line);background:#fff;font-size:12.5px;min-width:32px}
.pages button:hover:not(:disabled){border-color:var(--maroon);color:var(--maroon)}
.pages button.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.pages button:disabled{opacity:.4;cursor:not-allowed}

.empty{background:#fff;border:1px dashed var(--line-strong);padding:48px 24px;text-align:center}
.empty .icon{width:54px;height:54px;background:#F4ECEE;color:var(--maroon);display:grid;place-items:center;margin:0 auto 14px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:13px;margin-bottom:14px}

.upload-zone{background:#fff;border:2px dashed var(--line-strong);padding:46px;text-align:center;cursor:pointer;transition:all .15s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--maroon);background:#FBF6F7}
.upload-zone .ic{width:54px;height:54px;background:var(--maroon);color:var(--gold);display:grid;place-items:center;margin:0 auto 14px}
.upload-zone h3{font-size:16px;margin-bottom:4px}
.upload-zone p{color:var(--muted);font-size:13px}
.hide{display:none}

.panel-back{position:fixed;inset:0;background:rgba(20,10,12,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.panel-back.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:#fff;z-index:50;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);border-left:1px solid var(--line);display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-head h2{font-size:18px}
.panel-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.panel-head .close{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.panel-body{padding:20px 24px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{color:var(--ink);font-weight:500;word-break:break-word}
.divider{height:1px;background:var(--line);margin:18px 0}

.modal-back{position:fixed;inset:0;background:rgba(20,10,12,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-back.open{display:flex}
.modal{background:#fff;width:100%;max-width:480px;padding:26px}
.modal h2{font-size:18px;margin-bottom:6px}
.modal .field{margin:14px 0}
.modal label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
.modal input,.modal select{width:100%;padding:9px 11px;border:1px solid var(--line-strong)}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--maroon)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line-strong)}
.field input:focus{outline:none;border-color:var(--maroon)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;font-size:13px;border-left:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:340px}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}

.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--maroon-deep) 0%,var(--maroon) 60%,#2A0008 100%);padding:24px}
.login-card{background:#fff;width:100%;max-width:420px;padding:36px;border-top:3px solid var(--gold);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.login-logo .m{width:46px;height:46px;background:var(--maroon-deep);color:var(--gold);display:grid;place-items:center;font-family:Sora;font-weight:800;font-size:22px}
.login-logo .t{font-family:Sora;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.login-logo .t small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.14em;margin-top:3px}
.login-card h1{font-size:22px;margin-bottom:5px}
.login-card p.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-card form .field{margin-bottom:14px}
.login-card form .btn{width:100%;justify-content:center;padding:11px}
.login-card .err{background:var(--red-bg);color:var(--red);padding:10px 12px;font-size:13px;margin-bottom:14px;border-left:3px solid var(--red)}
.login-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--muted);letter-spacing:.06em}

.menu-btn{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:248px;transform:translateX(-100%);transition:transform .2s;z-index:30}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .col-4,.col-6,.col-8{grid-column:span 12}
  .set-grid{grid-template-columns:1fr}
  .panel{width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script>
/* ============================================================
   e& Governance — Talent Pool (cloud-synced)
   ============================================================ */
const SUPABASE_URL = 'https://rbyyzkhlnhhexruxlhtw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GVE5aoY-ckfNbefdcJHXhg_5ramPbt5';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const NS = 'eand_talent_';
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>localStorage.setItem(NS+k,JSON.stringify(v)),
  del:(k)=>localStorage.removeItem(NS+k),
};
const SS = {
  get:(k,d)=>{try{const v=sessionStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>sessionStorage.setItem(NS+k,JSON.stringify(v)),
  del:(k)=>sessionStorage.removeItem(NS+k),
};

const ADMIN = { username:'cmohammad', password:'123786', name:'C. Mohammad', role:'admin' };

const state = {
  user: SS.get('session', null),
  page: 'dashboard',
  candidates: [],
  users: [],
  settings: LS.get('settings', { portalName:'e& Governance — Talent Pool', logo:null }),
  filters: { q:'', company:'', status:'', designation:'', attendance:'' },
  sort: { col:'_idx', dir:'asc' },
  pageNum: 1,
  selected: null,
  charts: {},
  loaded: false,
};

function toast(msg, type=''){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},3200);
}

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10);

function fmtDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  const d=new Date(v); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return String(v);
}
function parseScore(v){
  if(v===null||v===undefined||v==='') return null;
  const n=parseFloat(String(v).replace(/[^\d.\-]/g,''));
  return isNaN(n)?null:n;
}
function normStatus(v){
  const s=String(v||'').toLowerCase();
  if(/pass|select|recommend|approve|short|yes|hire/.test(s)) return 'Passed';
  if(/fail|reject|not|no\b/.test(s)) return 'Failed';
  if(/hold|pend|review|wait|maybe/.test(s)) return 'On Hold';
  return v?String(v).trim():'On Hold';
}

/* ---------- Cloud ---------- */
// DB columns -> internal field names
function rowFromDb(r){
  return {
    id: r.id,
    sn: r.sn||'',
    empId: r.emp_id||'',
    name: r.candidate_name||'(Unnamed)',
    company: r.company||'',
    interviewDate: r.interview_date||'',
    attendance: r.attendance||'',
    techKnowledge: r.technical_knowledge||'',
    commSkill: r.communication_skill||'',
    drivingLicence: r.driving_licence||'',
    designation: r.designation||'',
    recommendedFor: r.recommended_for||'',
    remarks: r.remarks||'',
    finalStatus: r.final_status||'',
    score: parseScore(r.technical_knowledge),
    status: normStatus(r.recommended_for),
    createdAt: r.created_at,
  };
}
function rowToDb(c){
  return {
    sn: c.sn||null,
    emp_id: c.empId||null,
    candidate_name: c.name||null,
    company: c.company||null,
    interview_date: c.interviewDate||null,
    attendance: c.attendance||null,
    technical_knowledge: c.techKnowledge||null,
    communication_skill: c.commSkill||null,
    driving_licence: c.drivingLicence||null,
    designation: c.designation||null,
    recommended_for: c.recommendedFor||null,
    remarks: c.remarks||null,
    final_status: c.finalStatus||null,
  };
}
async function loadCandidates(){
  const { data, error } = await sb.from('candidates').select('*').order('created_at',{ascending:true});
  if(error){ console.error(error); toast('Failed to load from cloud','err'); return; }
  state.candidates = (data||[]).map(rowFromDb);
  state.loaded = true;
}
async function insertCandidates(rows){
  const payload = rows.map(rowToDb);
  // chunk to avoid huge payloads
  const chunkSize=500; let inserted=[];
  for(let i=0;i<payload.length;i+=chunkSize){
    const slice=payload.slice(i,i+chunkSize);
    const { data, error } = await sb.from('candidates').insert(slice).select();
    if(error){ console.error(error); toast('Cloud insert failed: '+error.message,'err'); return null; }
    inserted=inserted.concat(data||[]);
  }
  return inserted;
}
async function clearAllCandidates(){
  const { error } = await sb.from('candidates').delete().neq('id','00000000-0000-0000-0000-000000000000');
  if(error){ console.error(error); toast('Cloud clear failed','err'); return false; }
  return true;
}
function subscribeRealtime(){
  sb.channel('candidates-realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'candidates'},async ()=>{
      await loadCandidates();
      if(state.user) render();
    })
    .subscribe();
  sb.channel('app-users-realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'app_users'},async ()=>{
      await loadUsers();
      if(state.user && state.page==='users') render();
    })
    .subscribe();
}

async function loadUsers(){
  const { data, error } = await sb.from('app_users').select('*').order('created_at',{ascending:true});
  if(error){ console.error(error); return; }
  state.users = (data||[]).map(u=>({
    id:u.id, name:u.name, username:u.username, password:u.password,
    role:u.role, active:u.active, createdAt:(u.created_at||'').slice(0,10)
  }));
}
async function cloudInsertUser(u){
  const { data, error } = await sb.from('app_users').insert({
    name:u.name, username:u.username, password:u.password, role:u.role, active:u.active!==false
  }).select().single();
  if(error){ toast('Failed to save user: '+error.message,'err'); return null; }
  return data;
}
async function cloudUpdateUser(id, patch){
  const { error } = await sb.from('app_users').update(patch).eq('id',id);
  if(error){ toast('Failed to update user: '+error.message,'err'); return false; }
  return true;
}

/* ---------- Auth ---------- */
function login(username,password){
  if(username===ADMIN.username && password===ADMIN.password){
    const u={username:ADMIN.username,name:ADMIN.name,role:'admin'};
    SS.set('session',u); state.user=u; return true;
  }
  const u=state.users.find(x=>x.username===username && x.password===password && x.active);
  if(u){ const s={username:u.username,name:u.name,role:u.role}; SS.set('session',s); state.user=s; return true; }
  return false;
}
function logout(){ SS.del('session'); state.user=null; render(); }

}

function applyFilters(list){
  const f=state.filters;
  const q=f.q.toLowerCase().trim();
  return list.filter(c=>{
    if(f.company && c.company!==f.company) return false;
    if(f.status && c.finalStatus!==f.status) return false;
    if(f.designation && c.designation!==f.designation) return false;
    if(f.attendance && c.attendance!==f.attendance) return false;
    if(q){
      const hay=[c.name,c.empId,c.company,c.designation,c.recommendedFor,c.finalStatus,c.remarks,c.attendance].map(x=>String(x||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function computeStats(list){
  const total=list.length;
  const isSel=v=>/^selected$/i.test(String(v||'').trim());
  const isWait=v=>/wait/i.test(String(v||''));
  const isNot=v=>/not\s*selected|reject/i.test(String(v||''));
  const assessed=list.filter(c=>String(c.attendance||'').trim()!=='').length;
  const selected=list.filter(c=>isSel(c.finalStatus)).length;
  const waiting=list.filter(c=>isWait(c.finalStatus)).length;
  const notSel=list.filter(c=>isNot(c.finalStatus)).length;
  const companies=new Set(list.map(c=>c.company).filter(Boolean));
  const scores=list.map(c=>c.score).filter(s=>typeof s==='number');
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  return {total,assessed,selected,waiting,notSel,selRate:assessed?Math.round(selected/assessed*100):0,companies:companies.size,avg:avg.toFixed(1)};
}

function groupCount(arr,key){
  const m=new Map();
  arr.forEach(x=>{const k=x[key]||'Unspecified';m.set(k,(m.get(k)||0)+1);});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

const MAROON='#800000',MAROON2='#A0182B',MAROON_DEEP='#4D0010',GOLD='#C9A84C',GOLD2='#E6C66A',INK='#22141A';
const PALETTE=[MAROON,GOLD,MAROON2,GOLD2,'#C44A5C','#A4861F','#5B0010','#D8B870'];

function drawCharts(list){
  Chart.defaults.font.family="'DM Sans',sans-serif";
  Chart.defaults.font.size=11;
  Chart.defaults.color='#5A4A50';
  if(window.ChartDataLabels && !drawCharts._reg){ Chart.register(window.ChartDataLabels); drawCharts._reg=true; }

  const dlBar={anchor:'end',align:'end',color:'#22141A',font:{weight:'700',size:11},formatter:v=>v>0?v:''};
  const dlPie={color:'#fff',font:{weight:'700',size:12},formatter:(v,ctx)=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);const p=t?Math.round(v/t*100):0;return v>0?`${v} (${p}%)`:'';}};

  const isSel=v=>/^selected$/i.test(String(v||'').trim());
  const isWait=v=>/wait/i.test(String(v||''));
  const isNot=v=>/not\s*selected|reject/i.test(String(v||''));
  const sel=list.filter(c=>isSel(c.finalStatus)).length;
  const notS=list.filter(c=>isNot(c.finalStatus)).length;
  const wt=list.filter(c=>isWait(c.finalStatus)).length;
  const pending=list.length-sel-notS-wt;
  state.charts.status=new Chart($('#cStatus'),{type:'doughnut',data:{labels:['Selected','Not Selected','Waiting List','Pending'],datasets:[{data:[sel,notS,wt,pending],backgroundColor:['#16794C','#B42318','#C9A84C','#9aa0a6'],borderWidth:0}]},options:{cutout:'62%',layout:{padding:8},plugins:{legend:{position:'bottom'},datalabels:dlPie,tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);const p=t?Math.round(c.parsed/t*100):0;return ` ${c.label}: ${c.parsed} (${p}%)`;}}}}}});

  const dep=groupCount(list,'company').slice(0,8);
  state.charts.company=new Chart($('#cCompany'),{type:'bar',data:{labels:dep.map(d=>d[0]),datasets:[{data:dep.map(d=>d[1]),backgroundColor:GOLD,borderColor:'#A4861F',borderWidth:1}]},options:{indexAxis:'y',layout:{padding:{right:28}},plugins:{legend:{display:false},datalabels:{anchor:'end',align:'right',color:'#22141A',font:{weight:'700',size:11},formatter:v=>v>0?v:''}},scales:{x:{grid:{color:'#F0E6E8'}},y:{grid:{display:false}}}}});

  let att=groupCount(list,'attendance');
  const top=att.slice(0,6); const other=att.slice(6).reduce((a,b)=>a+b[1],0);
  const nl=top.map(n=>n[0]).concat(other?['Other']:[]); const nd=top.map(n=>n[1]).concat(other?[other]:[]);
  state.charts.att=new Chart($('#cAtt'),{type:'doughnut',data:{labels:nl,datasets:[{data:nd,backgroundColor:PALETTE,borderWidth:0}]},options:{cutout:'58%',layout:{padding:8},plugins:{legend:{position:'bottom',labels:{boxWidth:10}},datalabels:dlPie}}});

  const des=groupCount(list,'designation').slice(0,8);
  state.charts.des=new Chart($('#cDes'),{type:'bar',data:{labels:des.map(p=>p[0]),datasets:[{data:des.map(p=>p[1]),backgroundColor:MAROON2,borderColor:MAROON,borderWidth:1}]},options:{layout:{padding:{top:20}},plugins:{legend:{display:false},datalabels:dlBar},scales:{x:{grid:{display:false},ticks:{maxRotation:35,minRotation:0}},y:{grid:{color:'#F0E6E8'},beginAtZero:true,ticks:{precision:0}}}}});
}

function renderPool(el){
  const list=applyFilters(state.candidates);
  const sorted=[...list].sort((a,b)=>{
    const {col,dir}=state.sort; const m=dir==='asc'?1:-1;
    const av=a[col], bv=b[col];
    if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
    if(typeof av==='number'&&typeof bv==='number') return (av-bv)*m;
    return String(av).localeCompare(String(bv))*m;
  });
  const per=20;
  const totalPages=Math.max(1,Math.ceil(sorted.length/per));
  if(state.pageNum>totalPages) state.pageNum=1;
  const start=(state.pageNum-1)*per;
  const slice=sorted.slice(start,start+per);

  const uniq=k=>[...new Set(state.candidates.map(c=>c[k]).filter(Boolean))].sort();
  const companies=uniq('company'), designations=uniq('designation'), atts=uniq('attendance');

  el.innerHTML=`
  <div class="page-head">
    <div><h1>Talent Pool</h1><div class="sub">${list.length} of ${state.candidates.length} candidates · page ${state.pageNum} / ${totalPages}</div></div>
    <div class="actions">
      <button class="btn" id="exXlsx">Export Excel</button>
      <button class="btn btn-gold" id="exPdf">Export PDF</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="qSearch" placeholder="Search name, emp ID, company, designation, remarks…" value="${esc(state.filters.q)}"/>
    </div>
    <select class="select" id="fCompany"><option value="">All Companies</option>${companies.map(d=>`<option ${state.filters.company===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <select class="select" id="fStatus"><option value="">All Final Status</option>${['Selected','Not Selected','Waiting List'].map(s=>`<option ${state.filters.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <select class="select" id="fDes"><option value="">All Designations</option>${designations.map(p=>`<option ${state.filters.designation===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select class="select" id="fAtt"><option value="">All Attendance</option>${atts.map(n=>`<option ${state.filters.attendance===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
  </div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr>
        ${[['_idx','SN'],['empId','Emp ID'],['name','Candidate Name'],['company','Company'],['interviewDate','Interview Date'],['attendance','Attendance'],['techKnowledge','Tech Knowledge'],['commSkill','Comm Skill'],['drivingLicence','Lic'],['designation','Designation'],['recommendedFor','Recommended For'],['finalStatus','Final Status']]
          .map(([k,l])=>`<th data-sort="${k}">${l}${state.sort.col===k?(state.sort.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${slice.length?slice.map((c,i)=>`
          <tr data-id="${c.id}">
            <td class="num">${esc(c.sn||(start+i+1))}</td>
            <td class="num">${esc(c.empId||'—')}</td>
            <td><strong>${esc(c.name)}</strong></td>
            <td>${esc(c.company||'—')}</td>
            <td class="num">${esc(c.interviewDate||'')}</td>
            <td>${esc(c.attendance||'—')}</td>
            <td class="num">${esc(c.techKnowledge||'—')}</td>
            <td class="num">${esc(c.commSkill||'—')}</td>
            <td>${esc(c.drivingLicence||'—')}</td>
            <td>${esc(c.designation||'—')}</td>
            <td><span class="badge ${c.status==='Passed'?'pass':c.status==='Failed'?'fail':'hold'}">${esc(c.recommendedFor||c.status)}</span></td>

      </tbody>
    </table>
  </div>
  <div class="pager">
    <div>Showing ${slice.length?start+1:0}–${start+slice.length} of ${sorted.length}</div>
    <div class="pages">
      <button id="pPrev" ${state.pageNum===1?'disabled':''}>‹</button>
      ${pagerButtons(state.pageNum,totalPages)}
      <button id="pNext" ${state.pageNum===totalPages?'disabled':''}>›</button>

  $('#qSearch').addEventListener('input',e=>{state.filters.q=e.target.value;state.pageNum=1;renderPool(el);});

  });

  });

  $('#pNext').onclick=()=>{state.pageNum=Math.min(totalPages,state.pageNum+1);renderPool(el);};

  $('#exPdf').onclick=()=>exportPdf(sorted);
}
function pagerButtons(cur,total){
  const arr=[]; const window=2;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||(i>=cur-window&&i<=cur+window)) arr.push(i);
    else if(arr[arr.length-1]!=='…') arr.push('…');
  }
  return arr.map(p=>p==='…'?'<button disabled>…</button>':`<button data-page="${p}" class="${p===cur?'active':''}">${p}</button>`).join('');
}

const SYSTEM_FIELDS=[
  ['sn','SN'],
  ['empId','EMP ID'],
  ['name','CANDIDATE NAME'],
  ['company','COMPANY'],
  ['interviewDate','INTERVIEW DATE'],
  ['attendance','ATTENDANCE'],
  ['techKnowledge','TECHNICAL KNOWLEDGE'],
  ['commSkill','COMMUNICATION SKILL'],
  ['drivingLicence','DRIVING LICENCE'],
  ['designation','DESIGNATION'],
  ['recommendedFor','RECOMMENDED FOR'],
  ['finalStatus','FINAL STATUS'],
  ['remarks','REMARKS'],
];
const AUTO_MAP={
  sn:['sn','sr','sl','s.no','s no','serial','#'],
  empId:['emp id','employee id','empid','emp_id','emp.id','employee no'],
  name:['candidate name','candidate','name','full name','employee name'],
  company:['company','employer','organisation','organization','firm'],
  interviewDate:['interview date','date of interview','date','interviewed on'],
  attendance:['attendance','attended','present','status of attendance'],
  techKnowledge:['technical knowledge','technical','tech','technical skill','tech knowledge'],
  commSkill:['communication skill','communication','comm skill','communication skills'],
  drivingLicence:['driving licence','driving license','licence','license','dl'],
  designation:['designation','position','role','job title','title'],
  recommendedFor:['recommended for','recommendation','recommended','status','outcome','result'],
  finalStatus:['final status','final','selection status','selected','selection'],
  remarks:['remarks','comments','notes','remark'],
};
function autoMatch(header){
  const h=String(header||'').toLowerCase().trim().replace(/[._-]+/g,' ').replace(/\s+/g,' ');
  // exact match first
  for(const f of SYSTEM_FIELDS){
    if((AUTO_MAP[f[0]]||[]).some(k=>h===k)) return f[0];
  }
  // contains match
  for(const f of SYSTEM_FIELDS){
    if((AUTO_MAP[f[0]]||[]).some(k=>h.includes(k))) return f[0];
  }
  return '';
}

let pendingRows=null, pendingHeaders=null;

function renderUpload(el){

function downloadTemplate(){
  const headers=SYSTEM_FIELDS.map(f=>f[1]);
  const ws=XLSX.utils.aoa_to_sheet([headers,[1,'EMP-001','Ahmed Ali','e& Group','2025-01-15','Present',8.5,9,'Yes','Senior Engineer','Recommended','Strong candidate']]);

  XLSX.writeFile(wb,'eand-talent-pool-template.xlsx');

function handleFile(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
      if(!rows.length){toast('Empty sheet','err');return;}
      pendingHeaders=Object.keys(rows[0]);
      pendingRows=rows;
      showMapping();
    }catch(err){console.error(err);toast('Failed to parse file','err');}
  };
  r.readAsArrayBuffer(file);
}
function showMapping(){
  const map={}; pendingHeaders.forEach(h=>map[h]=autoMatch(h));
  const wrap=$('#mapStep'); wrap.classList.remove('hide');
  wrap.innerHTML=`<div class="card">
    <h3>Column Mapping<span class="hint">${pendingRows.length} rows detected</span></h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;max-height:340px;overflow:auto;padding-right:6px">
      ${pendingHeaders.map(h=>`
        <div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px">${esc(h)}</div>
          <select class="select" style="width:100%" data-h="${esc(h)}">
            <option value="">— Ignore —</option>
            ${SYSTEM_FIELDS.map(f=>`<option value="${f[0]}" ${map[h]===f[0]?'selected':''}>${esc(f[1])}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
      <button class="btn" id="mapCancel">Cancel</button>
      <button class="btn btn-primary" id="mapImport">Import ${pendingRows.length} Records to Cloud</button>
    </div>
  </div>`;
  $('#mapCancel').onclick=()=>{pendingRows=null;pendingHeaders=null;wrap.classList.add('hide');wrap.innerHTML='';};
  $('#mapImport').onclick=async ()=>{
    const m={}; wrap.querySelectorAll('select[data-h]').forEach(s=>{if(s.value)m[s.dataset.h]=s.value;});
    await importRows(m);
  };
}
async function importRows(mapping){
  const added=[];
  pendingRows.forEach(r=>{
    const c={};
    Object.entries(r).forEach(([k,v])=>{
      const f=mapping[k];
      if(!f) return;
      if(f==='interviewDate') c[f]=fmtDate(v);
      else c[f]=v===''?null:String(v).trim();
    });
    if(!c.name) c.name='(Unnamed)';
    added.push(c);
  });
  const btn=$('#mapImport'); if(btn){btn.disabled=true;btn.textContent='Saving to cloud…';}
  const inserted=await insertCandidates(added);
  if(!inserted){ if(btn){btn.disabled=false;btn.textContent=`Import ${pendingRows.length} Records to Cloud`;} return; }
  await loadCandidates();
  toast(`Added ${inserted.length} candidates to the shared pool`,'ok');
  pendingRows=null; pendingHeaders=null;
  state.page='pool'; render();
}

    <div style="font-size:42px;margin-bottom:8px">📥</div>
    <h3 style="color:var(--ink);margin:0 0 6px">No governance data yet</h3>
    <div style="font-size:13.5px">Upload an Excel with columns <b>COMPANY</b> (project name) and <b>FINAL STATUS</b> (Selected / Waiting List / Not Selected). Each project will appear here automatically.</div>
  </div>`:`
  <div class="gov-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;margin-top:18px">
    ${projNames.map(n=>govPanelHTML(n,GOV.projects[n],isAdmin)).join('')}
  </div>`}
  <input type="file" id="govUpFile" accept=".xlsx,.xls,.csv" style="display:none" />
  <style>@media(max-width:768px){.gov-grid{grid-template-columns:1fr!important}}</style>
  `;
  if(isAdmin){
    document.getElementById('govUpBtn').onclick=()=>document.getElementById('govUpFile').click();
    document.getElementById('govUpFile').onchange=ev=>ev.target.files[0]&&handleGovUpload(ev.target.files[0],el);
    el.querySelectorAll('[data-reqedit]').forEach(inp=>{
      inp.onchange=()=>{const n=inp.dataset.reqedit;const v=parseInt(inp.value,10);GOV.projects[n].requested=isNaN(v)?null:v;govSave(GOV);renderGovernance(el);toast('Requested updated for '+n,'ok');};
    });
  }
  document.getElementById('govExportPpt').onclick=exportGovPPT;
}

function govPanelHTML(name,d,isAdmin){
  const req=d.requested, sel=d.selected||0;
  const pct=req?Math.min(100,Math.round(sel/req*100)):0;
  const stats=[['Screened',d.screened],['Selected',d.selected],['Waiting',d.waiting],['Not Selected',d.notSelected],['Pending',d.pending]];
  const story=req
    ? `Project requested <b>${req}</b> resources. We screened <b>${d.screened}</b> from the pool and <b>${sel}</b> were selected — <b>${pct}%</b> of the ask is fulfilled.`
    : `<b>${d.screened}</b> candidates screened from the pool · <b>${sel}</b> selected. <span style="color:var(--amber)">Set "Requested" to complete the story.</span>`;
  const reqCell=isAdmin
    ? `<input data-reqedit="${esc(name)}" type="number" min="0" value="${req??''}" placeholder="—" style="width:70px;font-family:'Sora';font-size:20px;font-weight:700;color:var(--ink);border:1px dashed var(--line);border-radius:4px;padding:2px 6px;background:#fffbe9" title="Click to edit requested headcount" />`
    : `<div style="font-family:'Sora';font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums">${req??'—'}</div>`;
  return `
  <div class="card" style="padding:24px 26px;position:relative;overflow:hidden;display:flex;flex-direction:column">
    <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--maroon)"></div>
    <div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:700">Project</div>
    <h3 style="font-size:22px;font-weight:700;margin:6px 0 6px;color:var(--ink)">${esc(name)}</h3>
    <div style="font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:16px">${story}</div>
    <div style="margin:0 0 18px">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px">
        <span>${req?`${sel}/${req} allocated`:`${sel} selected · awaiting request count`}</span>
        <span style="color:var(--green)">${req?pct+'%':'—'}</span>
      </div>
      <div style="height:10px;background:#f1eaeb;border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--green);border-radius:6px;transition:width .4s"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px">
      <div>${reqCell}<div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600">Requested</div></div>
      ${stats.map(([l,v])=>`<div><div style="font-family:'Sora';font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums">${v??'—'}</div><div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600">${l}</div></div>`).join('')}
    </div>
  </div>`;
}

async function handleGovUpload(file,el){
  try{
    toast('Parsing '+file.name+'…','ok');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length) throw new Error('empty sheet');
    const keys=Object.keys(rows[0]);
    const find=(...n)=>keys.find(k=>{const s=k.toLowerCase().replace(/[\s_]+/g,'');return n.some(x=>s.includes(x))});
    const kProj=find('company','project','client','requestedby','screenedfor','recommendedfor');
    const kStat=find('finalstatus','status','decision','result','outcome');
    if(!kProj) throw new Error('No project column found (expected COMPANY / Project)');
    if(!kStat) throw new Error('No status column found (expected FINAL STATUS)');
    const projects={};
    rows.forEach(r=>{
      const p=String(r[kProj]||'').trim()||'Unassigned';
      if(!projects[p]) projects[p]={screened:0,selected:0,waiting:0,notSelected:0,pending:0,requested:(GOV.projects[p]&&GOV.projects[p].requested)??null};
      projects[p].screened++;
      const s=String(r[kStat]||'').toLowerCase().trim();
      if(/not\s*selected|reject|decline|fail/.test(s)) projects[p].notSelected++;
      else if(/wait/.test(s)) projects[p].waiting++;
      else if(/selected|recommend|approved|cleared|short.?list/.test(s)) projects[p].selected++;
      else projects[p].pending++;
    });
    GOV={poolTotal:rows.length,projects,updatedAt:new Date().toISOString()};
    govSave(GOV);
    renderGovernance(el);
    toast('Pool updated · '+rows.length+' candidates · '+Object.keys(projects).length+' projects','ok');
  }catch(e){console.error(e);toast('Upload failed: '+e.message,'err')}
}

async function exportGovPPT(){
  try{
    if(!window.PptxGenJS){toast('PPT library still loading…','err');return}
    const pptx=new PptxGenJS();
    pptx.layout='LAYOUT_WIDE';
    const MAROON='800000', INK='140A0C', MUTED='6B6168';
    const projNames=Object.keys(GOV.projects);
    const totalReq=projNames.reduce((a,k)=>a+(Number(GOV.projects[k].requested)||0),0);
    const totalSel=projNames.reduce((a,k)=>a+(GOV.projects[k].selected||0),0);
    const s1=pptx.addSlide();
    s1.background={color:'FFFFFF'};
    s1.addShape('rect',{x:0,y:0,w:13.333,h:0.55,fill:{color:MAROON},line:{color:MAROON}});
    s1.addText('e& Enterprise · Governance Talent Pool',{x:0.4,y:0.07,w:12,h:0.42,fontSize:16,bold:true,color:'FFFFFF',fontFace:'Calibri'});
    s1.addText('Governance Talent Pool',{x:0.5,y:0.85,w:12,h:0.6,fontSize:32,bold:true,color:INK,fontFace:'Calibri'});
    s1.addText('Project allocation summary · '+new Date().toLocaleDateString(),{x:0.5,y:1.5,w:12,h:0.35,fontSize:14,color:MUTED,fontFace:'Calibri'});

    const kpis=[
      {l:'Total Pool',v:GOV.poolTotal||'—',n:'Governance-curated reserve'},
      {l:'Total Requested',v:totalReq||'—',n:'Across '+projNames.length+' projects'},
      {l:'Total Selected',v:totalSel||'—',n:totalReq?Math.round(totalSel/Math.max(totalReq,1)*100)+'% of requested':'—'}
    ];
    kpis.forEach((k,i)=>{
      const x=0.5+i*4.2;
      s1.addShape('rect',{x,y:2.2,w:4,h:1.8,fill:{color:'FFFFFF'},line:{color:'ECECEF',width:1}});
      s1.addShape('rect',{x,y:2.2,w:0.06,h:1.8,fill:{color:MAROON},line:{color:MAROON}});
      s1.addText(k.l,{x:x+0.25,y:2.3,w:3.7,h:0.3,fontSize:10,bold:true,color:MUTED,fontFace:'Calibri',charSpacing:2});
      s1.addText(String(k.v),{x:x+0.25,y:2.65,w:3.7,h:0.8,fontSize:44,bold:true,color:INK,fontFace:'Calibri'});
      s1.addText(k.n,{x:x+0.25,y:3.5,w:3.7,h:0.3,fontSize:11,color:MUTED,fontFace:'Calibri'});
    });

    const panels=projNames.slice(0,2).map((n,i)=>({title:n,sub:((GOV.projects[n].requested||0)+' requested · '+(GOV.projects[n].selected||0)+' selected · '+(GOV.projects[n].screened||0)+' screened'),d:GOV.projects[n],x:0.5+i*6.35}));
    panels.forEach(p=>{
      s1.addShape('rect',{x:p.x,y:4.3,w:6,h:2.8,fill:{color:'FFFFFF'},line:{color:'ECECEF',width:1}});
      s1.addShape('rect',{x:p.x,y:4.3,w:0.06,h:2.8,fill:{color:MAROON},line:{color:MAROON}});
      s1.addText(p.title,{x:p.x+0.25,y:4.4,w:5.6,h:0.4,fontSize:18,bold:true,color:INK,fontFace:'Calibri'});
      s1.addText(p.sub,{x:p.x+0.25,y:4.8,w:5.6,h:0.3,fontSize:11,color:MUTED,fontFace:'Calibri'});
      const pct=p.d.requested?Math.round((p.d.selected||0)/p.d.requested*100):0;
      s1.addShape('rect',{x:p.x+0.25,y:5.25,w:5.5,h:0.18,fill:{color:'F1F1F4'},line:{color:'F1F1F4'}});
      if(pct>0) s1.addShape('rect',{x:p.x+0.25,y:5.25,w:5.5*pct/100,h:0.18,fill:{color:'16794C'},line:{color:'16794C'}});
      s1.addText(pct+'% allocated',{x:p.x+0.25,y:5.45,w:5.5,h:0.3,fontSize:11,color:INK,bold:true,fontFace:'Calibri'});
      const sts=[['Req.',p.d.requested],['Screened',p.d.screened],['Selected',p.d.selected],['Waiting',p.d.waiting],['Not Sel.',p.d.notSelected]];
      sts.forEach((st,i)=>{
        const sx=p.x+0.25+i*1.15;
        s1.addText(String(st[1]??'—'),{x:sx,y:5.95,w:1.1,h:0.45,fontSize:18,bold:true,color:INK,fontFace:'Calibri'});
        s1.addText(st[0],{x:sx,y:6.4,w:1.1,h:0.3,fontSize:9,color:MUTED,bold:true,fontFace:'Calibri',charSpacing:1});
      });
    });
    s1.addText('© '+new Date().getFullYear()+' e& Enterprise · Governance Team',{x:0.4,y:7.1,w:12,h:0.3,fontSize:10,color:MUTED,fontFace:'Calibri'});
    await pptx.writeFile({fileName:'Talent_Governance_Dashboard_'+new Date().toISOString().slice(0,10)+'.pptx'});
    toast('Slide exported','ok');
  }catch(e){console.error(e);toast('Export failed: '+e.message,'err')}
}

  render();
